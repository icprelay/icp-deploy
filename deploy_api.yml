trigger: none

resources:
  repositories:
    - repository: icpcore
      type: github
      name: icprelay/icp-core
      ref: refs/tags/v0.2.1
      endpoint: 'icp-git-connection'

pool:
  vmImage: 'windows-latest'

parameters:
- name: 'projectname'
  displayName: 'Project name'
  type: string
  default: 'icp'
- name: 'customername'
  displayName: 'Customer name'
  type: string
  default: ''
- name: 'subscription'
  displayName: 'Azure Service connection name'
  type: string
  default: 'icp-azure-connection'
  values: [icp-azure-connection]
- name: 'git'
  displayName: 'Git Service connection name'
  type: string
  default: 'icp-git-connection'
  values: [icp-git-connection]

variables:
  solution: '**/*.slnx'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'
 
steps:
- checkout: self
- checkout: icpcore

- task: UseDotNet@2
  displayName: 'Use .NET 10.0 SDK'
  inputs:
    packageType: sdk
    version: 10.0.x
    installationPath: $(Agent.ToolsDirectory)/dotnet
 
- task: NuGetToolInstaller@1
 
- task: DotNetCoreCLI@2
  inputs:
    command: 'restore'
    projects: '$(Build.SourcesDirectory)/icp-core/src/Icp.Api.Host/Icp.Api.Host.csproj'
    includeNuGetOrg: true
        
- task: DotNetCoreCLI@2
  displayName: 'Publish web api csproj files'
  inputs:
    command: publish
    arguments: -c Release
    projects: |
      $(Build.SourcesDirectory)/icp-core/src/Icp.Api.Host/Icp.Api.Host.csproj
    publishWebProjects: false
    zipAfterPublish: false
 
- task: ArchiveFiles@2
  displayName: 'Zip web api'
  inputs:
    rootFolderOrFile: '$(Build.SourcesDirectory)/icp-core/src/Icp.Api.Host/bin/Release/net10.0/publish/'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.DefaultWorkingDirectory)/api.zip'
    replaceExistingArchive: true
    verbose: true

- task: PublishBuildArtifacts@1
  displayName: publish web artifact
  inputs:
    PathtoPublish: '$(Build.DefaultWorkingDirectory)/api.zip'
    ArtifactName: 'drop'
    publishLocation: 'Container'

- task: DownloadBuildArtifacts@0
  displayName: 'Download Artifact'
  inputs:
    buildVersionToDownload: latest
    downloadType: single
    artifactName: drop
    downloadPath: '$(System.DefaultWorkingDirectory)'

- task: AzureWebApp@1
  displayName: 'Publish artifact'
  inputs:
    azureSubscription: ${{ parameters.subscription }}
    resourceGroupName: 'icp-runtime'
    appType: webApp
    appName: '${{ parameters.projectname}}-${{ parameters.customername }}-web-api'
    deploymentMethod: zipDeploy
    package: '$(System.DefaultWorkingDirectory)/drop/api.zip'