trigger:
- none

pool:
  vmImage: 'ubuntu-latest'

parameters:
- name: 'projectname'
  displayName: 'Project name'
  type: string
  default: 'icp'
- name: 'customername'
  displayName: 'Customer name'
  type: string
  default: ''
- name: 'packname'
  displayName: 'Pack name'
  type: string
  default: ''
- name: 'packtype'
  displayName: 'Pack type'
  type: string
  values:
    ['src', 'tgt']
- name: 'packageurl'
  displayName: 'Package SAS Url'
  type: 'string'
  default: ''
- name: 'subscription'
  displayName: 'Azure Service connection name'
  type: string
  default: 'icp-azure-connection'
  values: [icp-azure-connection]
- name: 'git'
  displayName: 'Git Service connection name'
  type: string
  default: 'icp-git-connection'
  values: [icp-git-connection]
- name: 'apiappclientid'
  displayName: 'API App Registration Client ID'
  type: string
  default: 'YOUR_API_APP_REGISTRATION_ID'
- name: 'location'
  type: string
  default: 'West Europe'

steps:
- checkout: self
- bash: |
    echo "Downloading pack"
    curl -L "${{ parameters.packageurl }}" -o pack.zip --verbose

    mkdir pack
    unzip pack.zip -d pack
   
    mv pack/*/* pack/
  displayName: Download pack
  
- task: AzureCLI@2
  inputs:
    azureSubscription: '${{ parameters.subscription }}'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      az deployment group create --resource-group "icp-runtime" --template-file "pack/infra/main.bicep" --parameters project="${{ parameters.projectname }}-${{ parameters.customername}}" packname="${{ parameters.packname }}" apiClientId="${{ parameters.apiappclientid }}"
  displayName: 'Deploy Bicep Files'

- task: ArchiveFiles@2
  displayName: Package Logic App workflows
  inputs:
    rootFolderOrFile: 'pack/workspace/logicapp'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: 'pack/drop/logicapp.zip'
    replaceExistingArchive: true

- task: AzureFunctionApp@2
  displayName:  ${{ parameters.projectname }}-${{ parameters.customername }}-logicapp-${{ parameters.packtype}}-${{ parameters.packname }}
  inputs:
    azureSubscription: '${{ parameters.subscription }}'
    appType: 'functionApp'
    appName: '${{ parameters.projectname }}-${{ parameters.customername }}-logicapp-${{ parameters.packtype}}-${{ parameters.packname }}'
    package: 'pack/drop/logicapp.zip'
    deploymentMethod: 'zipDeploy'